  { q: "99. Statistical Quality Control (SQC) me Control limits (μ ± 3σ) kitna percent data cover karti hain?", pyq: "GGU VRET 2022", options: ["99.73%", "95%", "68.27%", "90%"], ans: 0 },
  { q: "100. c-chart kis cheez ke liye control chart hota hai?", pyq: "GGU VRET 2020", options: ["Number of defects per unit", "Fraction defectives", "Mean", "Range"], ans: 0 }
];

// Render Questions
const container = document.getElementById('questions-container');
questionsData.forEach((q, index) => {
  let qHtml = `
    <div class="q-card" id="q-card-${index}">
      <div class="q-header">
        <strong>Question ${index + 1}</strong>
        <span class="pyq-tag">${q.pyq}</span>
      </div>
      <p style="font-weight:600; font-size:16px;">${q.q}</p>
      <div class="options-group">
  `;
  q.options.forEach((opt, optIdx) => {
    qHtml += `
      <label>
        <input type="radio" name="q${index}" value="${optIdx}">
        ${opt}
      </label>
    `;
  });
  qHtml += `</div></div>`;
  container.innerHTML += qHtml;
});

// Timer Functionality (60 Minutes)
let timeLeft = 3600;
const timerElem = document.getElementById('timer');
const timerInterval = setInterval(() => {
  let minutes = Math.floor(timeLeft / 60);
  let seconds = timeLeft % 60;
  seconds = seconds < 10 ? '0' + seconds : seconds;
  timerElem.innerHTML = `${minutes}:${seconds}`;
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    alert('Time is up! Submitting test automatically.');
    calculateScore();
  }
  timeLeft--;
}, 1000);

// Score Calculation and Answer Analysis
function calculateScore() {
  clearInterval(timerInterval);
  let score = 0;
  let analysisHtml = "";

  questionsData.forEach((q, index) => {
    const selected = document.querySelector(`input[name="q${index}"]:checked`);
    let userAns = selected ? parseInt(selected.value) : -1;
    
    if (userAns === q.ans) {
      score++;
    }

    let userAnsText = userAns !== -1 ? q.options[userAns] : "Not Attempted";
    let correctAnsText = q.options[q.ans];

    analysisHtml += `
      <div style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
        <p style="margin: 0 0 5px 0;"><strong>${q.q}</strong> <span style="font-size:11px; color:#888;">(${q.pyq})</span></p>
        <p style="margin: 0; font-size: 14px;">Your Answer: <span class="${userAns === q.ans ? 'correct-ans' : 'wrong-ans'}">${userAnsText}</span></p>
        ${userAns !== q.ans ? `<p style="margin: 0; font-size: 14px;">Correct Answer: <span class="correct-ans">${correctAnsText}</span></p>` : ''}
      </div>
    `;
  });

  // Hide Quiz Form, Show Score Card
  document.getElementById('quiz-form').style.display = 'none';
  const scoreCard = document.getElementById('score-card');
  scoreCard.style.display = 'block';

  document.getElementById('final-score').innerHTML = `${score} / 100`;

  let statusMsg = "";
  if(score >= 70) {
    statusMsg = "<strong style='color:var(--success);'>Excellent Performance! High chance of qualifying VRET JRF.</strong>";
  } else if(score >= 50) {
    statusMsg = "<strong style='color:#ff9800;'>Good Effort! Needs a little more revision on Core Statistics.</strong>";
  } else {
    statusMsg = "<strong style='color:var(--danger);'>Keep practicing! Focus more on Research Methodology & basic formulas.</strong>";
  }
  document.getElementById('score-status').innerHTML = statusMsg;
  document.getElementById('analysis-list').innerHTML = analysisHtml;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
