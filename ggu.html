function renderVretQuiz() {
    var container = document.getElementById('vretQuestionsContainer');
    if (!container) return;
    
    var htmlStr = '';
    for (var i = 0; i < quizItems.length; i++) {
        if (i === 0) {
            htmlStr += '<div class="sec-header">SECTION - A: Research Methodology (Q1 - Q50)</div>';
        } else if (i === 50) {
            htmlStr += '<div class="sec-header">SECTION - B: Education Core Subject (Q51 - Q100)</div>';
        }

        var item = quizItems[i];
        htmlStr += '<div class="q-card">';
        htmlStr += '<div class="q-title">' + item.q + '</div>';
        
        for (var j = 0; j < item.opts.length; j++) {
            var letter = String.fromCharCode(65 + j);
            htmlStr += '<label class="opt-label">';
            htmlStr += '<input type="radio" name="vq' + i + '" value="' + j + '"> ';
            htmlStr += letter + ') ' + item.opts[j];
            htmlStr += '</label>';
        }
        htmlStr += '</div>';
    }
    container.innerHTML = htmlStr;
}

function submitVretQuiz() {
    var score = 0, correct = 0, wrong = 0;
    var reviewHtml = '';

    for (var i = 0; i < quizItems.length; i++) {
        var item = quizItems[i];
        var radios = document.getElementsByName('vq' + i);
        var selectedVal = -1;

        for (var r = 0; r < radios.length; r++) {
            if (radios[r].checked) {
                selectedVal = parseInt(radios[r].value);
                break;
            }
        }

        var isCorrect = (selectedVal === item.ans);
        if (isCorrect) {
            score++; correct++;
        } else if (selectedVal !== -1) {
            wrong++;
        }

        var userText = (selectedVal !== -1) ? String.fromCharCode(65 + selectedVal) + ') ' + item.opts[selectedVal] : 'Not Answered';
        var correctText = String.fromCharCode(65 + item.ans) + ') ' + item.opts[item.ans];

        reviewHtml += '<div class="q-card" style="border-left: 4px solid ' + (isCorrect ? '#16a34a' : '#dc2626') + ';">';
        reviewHtml += '<div class="q-title">' + item.q + '</div>';
        reviewHtml += '<p>Your Answer: <span class="' + (isCorrect ? 'ans-correct' : 'ans-wrong') + '">' + userText + '</span></p>';
        reviewHtml += '<p>Correct Answer: <span class="ans-correct">' + correctText + '</span></p>';
        reviewHtml += '</div>';
    }

    var percent = (score / 100) * 100;
    var isPass = percent >= 50;

    var scoreBox = document.getElementById('scoreBox');
    scoreBox.className = 'score-box ' + (isPass ? 'pass' : 'fail');
    document.getElementById('statusText').innerText = isPass ? "QUALIFIED 🎉" : "NOT QUALIFIED ❌";
    document.getElementById('statusDesc').innerText = isPass ? "Congratulations! You scored above 50% cutoff." : "You scored below 50%. Practice more for better results.";
    
    document.getElementById('mScore').innerText = score + " / 100";
    document.getElementById('mPercent').innerText = percent.toFixed(1) + "%";
    document.getElementById('mCorrect').innerText = correct;
    document.getElementById('mWrong').innerText = wrong;

    document.getElementById('answerKeyList').innerHTML = reviewHtml;
    document.getElementById('resultModal').style.display = 'block';
    document.getElementById('resultModal').scrollIntoView({ behavior: 'smooth' });
}

// Auto-run when DOM is loaded
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderVretQuiz);
} else {
    renderVretQuiz();
}
